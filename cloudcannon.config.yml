_schema: _schema
source: /
paths:
  uploads: public/uploads
  static: public
collections_config:
  pages:
    path: src/content/pages
    glob: []
    icon: web_asset
    url: '"/[slug/"'
    disable_url: false
    description: ''
    _editables:
    _enabled_editors:
      - visual
      - content
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
base_url: dist
source_editor:
  tab_size: 2
  theme: monokai
  show_gutter: true
timezone: Europe/Stockholm
markdown:
  engine: commonmark
  options:
    xhtml: false
    breaks: false
    linkify: false
    typographer: false
    spaced_lists: false
    sentence_per_line: false
    gfm: true
    code_block_fences: '```'
    escape_snippets_in_code_blocks: false
    treat_indentation_as_code: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    attributes: false
